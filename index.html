<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#14263d"><link rel="manifest" href="manifest.json">
<title>1 Minuto com Deus</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f5f1e8;color:#172235}
header{background:linear-gradient(145deg,#10233a,#254968);color:white;padding:30px 20px;text-align:center;border-radius:0 0 28px 28px}
.logo{font-size:30px;font-weight:800}.gold{color:#e0b84c}.sub{opacity:.9}
main{max-width:680px;margin:auto;padding:18px}.card{background:white;border-radius:22px;padding:24px;box-shadow:0 8px 28px #17223518}
.day{font-size:13px;letter-spacing:2px;text-transform:uppercase;opacity:.6}h1{margin:8px 0 4px;font-size:28px}h2{font-size:17px;margin-top:22px}
p{line-height:1.65}.verse{font-size:19px;font-weight:700;padding:16px;border-left:4px solid #d5a83e;background:#fbf7ea;border-radius:10px}
button{border:0;border-radius:14px;padding:13px 17px;background:#d5a83e;color:#172235;font-weight:800;cursor:pointer;margin:4px}
.nav{display:flex;justify-content:space-between;gap:8px;position:sticky;bottom:12px;background:#ffffffee;padding:8px;border-radius:18px;box-shadow:0 5px 25px #0002}
.share{background:#14263d;color:white}.small{font-size:13px;opacity:.7}footer{text-align:center;padding:25px;opacity:.65;font-size:13px}
</style></head><body>
<header><div class="logo">1 Minuto <span class="gold">com Deus</span></div><div class="sub">Uma pausa. Uma oração. Um novo dia.</div></header>
<main><div class="card"><div class="day" id="day"></div><h1 id="title"></h1><div class="verse" id="ref"></div>
<h2>💭 Reflexão</h2><p id="reflection"></p><h2>🙏 Ore</h2><p id="prayer"></p><h2>🎯 Desafio do dia</h2><p id="challenge"></p>
<button class="share" onclick="shareDay()">Compartilhar</button><button onclick="markRead()">✓ Concluído</button><p class="small" id="status"></p></div>
<div class="nav"><button onclick="prev()">← Anterior</button><button onclick="today()">Hoje</button><button onclick="next()">Próximo →</button></div></main>
<footer>1 Minuto com Deus • 30 dias de devocionais<br><strong>Autor: Marcos Antônio Santos de Andrade Júnior</strong></footer>
<script>
const cards=[{"day": 1, "title": "Comece com Deus", "reference": "Isaías 41:10", "reflection": "Hoje, escolha começar o dia lembrando que você não caminha sozinho. A presença de Deus pode trazer coragem para aquilo que você ainda não sabe resolver.", "prayer": "Senhor, guia meu dia, fortalece meu coração e ajuda-me a confiar em Ti. Amém.", "challenge": "Antes de olhar as redes sociais, faça uma oração de 1 minuto."}, {"day": 2, "title": "Confie", "reference": "Provérbios 3:5-6", "reflection": "Nem tudo precisa ser entendido hoje. Há momentos em que confiar é o passo de fé que Deus espera de nós.", "prayer": "Senhor, entrego meus planos a Ti e peço direção para cada decisão. Amém.", "challenge": "Entregue a Deus, em oração, uma preocupação específica."}, {"day": 3, "title": "Paz", "reference": "João 14:27", "reflection": "A paz de Deus não depende de um dia perfeito. Ela pode permanecer mesmo quando existem problemas ao redor.", "prayer": "Senhor, acalma meus pensamentos e guarda meu coração em Tua paz. Amém.", "challenge": "Fique um minuto em silêncio e agradeça a Deus por três coisas."}, {"day": 4, "title": "Força", "reference": "Filipenses 4:13", "reflection": "Você pode se sentir fraco e ainda assim continuar. A força que vem da fé é coragem para atravessar as dificuldades.", "prayer": "Senhor, sustenta-me quando minhas forças diminuírem. Amém.", "challenge": "Faça hoje uma coisa que você está adiando por medo."}, {"day": 5, "title": "Gratidão", "reference": "Salmos 100:4", "reflection": "A gratidão muda o jeito como enxergamos o dia. Antes de pedir, reconheça aquilo que Deus já colocou em suas mãos.", "prayer": "Senhor, obrigado pela vida, pela minha família e por mais um dia. Amém.", "challenge": "Liste mentalmente cinco motivos para agradecer."}, {"day": 6, "title": "Perdão", "reference": "Efésios 4:32", "reflection": "Perdoar não apaga o que aconteceu, mas pode impedir que a dor continue controlando o coração.", "prayer": "Senhor, ajuda-me a liberar o perdão e a agir com graça. Amém.", "challenge": "Ore por alguém que você precisa perdoar ou compreender."}, {"day": 7, "title": "Esperança", "reference": "Romanos 15:13", "reflection": "Mesmo quando o caminho parece fechado, a esperança pode nascer novamente. Deus continua trabalhando além daquilo que você consegue ver.", "prayer": "Senhor, renova minha esperança e meu ânimo. Amém.", "challenge": "Envie uma mensagem de esperança para alguém."}, {"day": 8, "title": "Família", "reference": "Josué 24:15", "reflection": "A fé também é vivida dentro de casa. Pequenos momentos de oração e carinho podem fortalecer uma família inteira.", "prayer": "Senhor, abençoa minha casa e aproxima nossos corações de Ti. Amém.", "challenge": "Ore por sua família pelo nome."}, {"day": 9, "title": "Coragem", "reference": "Josué 1:9", "reflection": "Coragem não é não sentir medo. É decidir continuar mesmo sentindo medo, confiando que Deus está presente.", "prayer": "Senhor, dá-me coragem para enfrentar o que preciso enfrentar hoje. Amém.", "challenge": "Enfrente hoje uma pequena situação que você vem evitando."}, {"day": 10, "title": "Sabedoria", "reference": "Tiago 1:5", "reflection": "Quando faltar clareza, peça sabedoria. Deus pode orientar seu coração enquanto você busca agir com responsabilidade.", "prayer": "Senhor, dá-me sabedoria para escolher o que é certo. Amém.", "challenge": "Antes de uma decisão importante, ore por 1 minuto."}, {"day": 11, "title": "Recomeço", "reference": "Lamentações 3:22-23", "reflection": "Um dia difícil não precisa definir sua história. Cada manhã pode ser uma oportunidade de recomeçar com Deus.", "prayer": "Senhor, obrigado por novas oportunidades. Ajuda-me a recomeçar. Amém.", "challenge": "Escolha uma atitude que represente um novo começo."}, {"day": 12, "title": "Paciência", "reference": "Salmos 27:14", "reflection": "Esperar pode ser difícil. A espera também pode formar nosso caráter e nossa confiança.", "prayer": "Senhor, ensina-me a esperar sem perder a fé. Amém.", "challenge": "Hoje, transforme uma espera em oração."}, {"day": 13, "title": "Proteção", "reference": "Salmos 121:7-8", "reflection": "Ao sair de casa ou enfrentar uma nova jornada, entregue seus caminhos a Deus e aja com prudência.", "prayer": "Senhor, guarda meus caminhos e minha família hoje. Amém.", "challenge": "Faça uma oração curta antes de sair de casa."}, {"day": 14, "title": "Amor", "reference": "1 Coríntios 13:4-7", "reflection": "O amor cristão aparece em atitudes: paciência, bondade, humildade e disposição para permanecer firme.", "prayer": "Senhor, ensina-me a amar com atitudes e não apenas com palavras. Amém.", "challenge": "Faça hoje uma atitude de amor sem esperar reconhecimento."}, {"day": 15, "title": "Serviço", "reference": "Marcos 10:45", "reflection": "Servir pode parecer pequeno aos olhos do mundo, mas uma atitude sincera pode transformar o dia de alguém.", "prayer": "Senhor, mostra-me quem posso ajudar hoje. Amém.", "challenge": "Ajude alguém em uma tarefa simples."}, {"day": 16, "title": "Fé", "reference": "Hebreus 11:1", "reflection": "Fé não é fingir que os problemas não existem. É continuar confiando em Deus enquanto você faz sua parte.", "prayer": "Senhor, aumenta minha fé e ajuda-me a permanecer firme. Amém.", "challenge": "Anote uma promessa bíblica que fortalece você."}, {"day": 17, "title": "Silêncio", "reference": "Salmos 46:10", "reflection": "Em uma rotina cheia de notificações, parar por alguns instantes também é uma forma de cuidado espiritual.", "prayer": "Senhor, aquieta meu coração para que eu perceba Tua presença. Amém.", "challenge": "Fique cinco minutos sem celular hoje, em oração."}, {"day": 18, "title": "Humildade", "reference": "Miquéias 6:8", "reflection": "Andar com Deus envolve reconhecer que não sabemos tudo e que precisamos aprender, corrigir e crescer.", "prayer": "Senhor, dá-me um coração humilde e ensinável. Amém.", "challenge": "Peça desculpas por algo que você fez, se necessário."}, {"day": 19, "title": "Contentamento", "reference": "Filipenses 4:11-12", "reflection": "Contentamento não significa desistir dos sonhos. Significa valorizar o que Deus já colocou em suas mãos enquanto você continua avançando.", "prayer": "Senhor, ensina-me a viver com gratidão em cada fase. Amém.", "challenge": "Agradeça por algo simples que você normalmente ignora."}, {"day": 20, "title": "Ansiedade", "reference": "1 Pedro 5:7", "reflection": "Quando a preocupação ocupar sua mente, transforme aquilo em oração. Você não precisa carregar tudo sozinho.", "prayer": "Senhor, entrego minhas preocupações a Ti e peço descanso para minha mente. Amém.", "challenge": "Escreva uma preocupação e entregue-a a Deus em oração."}, {"day": 21, "title": "Descanso", "reference": "Mateus 11:28", "reflection": "Descansar não é fracassar. Há momentos em que parar, respirar e reorganizar o coração é necessário.", "prayer": "Senhor, ajuda-me a encontrar descanso em Ti e equilíbrio na minha rotina. Amém.", "challenge": "Separe hoje alguns minutos para descansar sem culpa."}, {"day": 22, "title": "Propósito", "reference": "Efésios 2:10", "reflection": "Sua vida pode ter significado nas pequenas escolhas de cada dia. O propósito também aparece quando usamos nossos dons para fazer o bem.", "prayer": "Senhor, mostra-me como usar meus dons para servir e fazer o bem. Amém.", "challenge": "Faça uma boa ação usando uma habilidade que você possui."}, {"day": 23, "title": "Relacionamentos", "reference": "Provérbios 15:1", "reflection": "Uma resposta branda pode impedir que uma conversa difícil se transforme em uma briga. Sabedoria também é saber como falar.", "prayer": "Senhor, coloca sabedoria nas minhas palavras. Amém.", "challenge": "Pense antes de responder em uma conversa difícil."}, {"day": 24, "title": "Disciplina", "reference": "1 Coríntios 9:24-25", "reflection": "Grandes mudanças costumam nascer de pequenas atitudes repetidas. Persevere mesmo quando a motivação diminuir.", "prayer": "Senhor, ajuda-me a ser constante no que é bom. Amém.", "challenge": "Escolha uma pequena prática saudável para repetir por sete dias."}, {"day": 25, "title": "Generosidade", "reference": "2 Coríntios 9:7", "reflection": "Generosidade não é apenas dinheiro. Tempo, atenção, cuidado e palavras também podem ser presentes.", "prayer": "Senhor, abre meus olhos para oportunidades de compartilhar o bem. Amém.", "challenge": "Doe seu tempo ou atenção a alguém hoje."}, {"day": 26, "title": "Integridade", "reference": "Provérbios 10:9", "reflection": "Fazer o certo quando ninguém está olhando também é parte da nossa fé. Integridade constrói confiança.", "prayer": "Senhor, ajuda-me a ser verdadeiro em minhas escolhas. Amém.", "challenge": "Escolha hoje a honestidade em uma situação pequena."}, {"day": 27, "title": "Livramento", "reference": "Salmos 34:4", "reflection": "Algumas vezes olhamos para trás e percebemos que passamos por situações das quais nem imaginávamos sair. Lembre-se dos livramentos que já viveu.", "prayer": "Senhor, obrigado por me sustentar e me livrar tantas vezes. Amém.", "challenge": "Lembre-se de um livramento e agradeça a Deus por ele."}, {"day": 28, "title": "Alegria", "reference": "Salmos 16:11", "reflection": "A alegria pode ser cultivada mesmo em fases difíceis. Procure motivos para sorrir, agradecer e continuar.", "prayer": "Senhor, renova minha alegria e não permita que as dificuldades roubem minha esperança. Amém.", "challenge": "Faça alguém sorrir hoje."}, {"day": 29, "title": "Direção", "reference": "Salmos 32:8", "reflection": "Nem sempre teremos o mapa completo. Podemos dar o próximo passo com prudência e oração.", "prayer": "Senhor, direciona meus passos e dá-me discernimento para o próximo passo. Amém.", "challenge": "Pergunte em oração: “Qual é o próximo passo correto?”"}, {"day": 30, "title": "Encerramento", "reference": "Salmos 90:17", "reflection": "Ao terminar este ciclo, olhe para trás e perceba o quanto pequenas pausas com Deus podem mudar a forma de viver o dia.", "prayer": "Senhor, confirma a obra das minhas mãos e continua comigo nos próximos dias. Amém.", "challenge": "Compartilhe este projeto com alguém que precisa de um minuto com Deus."}];
let current=parseInt(localStorage.getItem('day')||'1');
function render(){const c=cards[current-1];day.textContent='Dia '+c.day+' de 30';title.textContent=c.title;ref.textContent=c.reference;reflection.textContent=c.reflection;prayer.textContent=c.prayer;challenge.textContent=c.challenge;status.textContent=localStorage.getItem('done'+current)?'✓ Você já concluiu este devocional.':'';localStorage.setItem('day',current)}
function next(){current=Math.min(30,current+1);render()}function prev(){current=Math.max(1,current-1);render()}function today(){current=parseInt(localStorage.getItem('day')||'1');render()}function markRead(){localStorage.setItem('done'+current,'1');render()}
async function shareDay(){const c=cards[current-1],text=`1 Minuto com Deus — Dia ${c.day}\n${c.title}\n${c.reference}\n\n${c.reflection}`;if(navigator.share)await navigator.share({title:'1 Minuto com Deus',text});else{await navigator.clipboard.writeText(text);alert('Mensagem copiada!')}}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');render();
</script></body></html>
